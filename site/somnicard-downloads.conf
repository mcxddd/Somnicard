# Only install at the existing Somnicard location after staging verified public assets.
# Backups belong under /var/backups, never in 1Panel's scanned proxy directory.
location ^~ /downloads/somnicard/ {
    alias /www/sites/mygit/downloads/somnicard/;
    index index.html;
    autoindex off;
    sendfile on;
    etag on;
    max_ranges 1;
    default_type application/octet-stream;
    types {
        text/html html;
        text/css css;
        application/json json;
        image/webp webp;
        application/vnd.android.package-archive apk;
        text/plain sha256;
    }
    set $somnicard_disposition "";
    set $somnicard_cache "no-cache";
    if ($uri ~* "\.(apk|sha256)$") {
        set $somnicard_disposition "attachment";
        set $somnicard_cache "public, max-age=3600";
    }
    add_header Content-Disposition $somnicard_disposition;
    add_header Cache-Control $somnicard_cache;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'none'; style-src 'self'; img-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    limit_except GET { deny all; }
}
